services:
  - type: web
    name: churchosapp
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24
      - key: CHURCHOS_DB_PROVIDER
        value: supabase
      - key: CHURCHOS_PUBLIC_URL
        value: https://churchosapp.org
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CHURCHOS_SESSION_SECRET
        sync: false
